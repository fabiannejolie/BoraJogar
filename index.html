<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoraJogar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="home-screen">
        <h1>BoraJogar</h1>
        <p><button id="play-button">Jogar</button></p>
    </section>

    <section id="impostor">
      <h1>Impostor</h1>
      <menu>
      <button id="players-number">Quantidade de jogadores</button><br>
      <button id="back-button">Voltar</button>
      </menu>
    </section>

    <section id="amount-of-players">
      <h1>Escolha a quantidade de jogadores:</h1>
      <input type="number" name="" id="input-players-number"><br>
      <button id="btn-confirm-players-number">Confirmar</button>
    </section>

    <section id="players-name">
      <h1>Qual o nome de cada jogador?</h1>
      <form id="players-name-form">
        <div id="players-name-inputs"></div>
        <button type="submit">Confirmar nomes</button>
      </form>
    </section>

    <section id="config-impostor-screen">
      <h1>Impostor</h1>
      <div class="setting-control">
        <span>Impostores</span>
        <button id="decrease-impostor-quantity" class="decrease-button">-</button>
        <div id="impostor-quantity">1</div>
        <button id="increase-impostor-quantity" class="increase-button">+</button>
      </div>
      <div class="setting-control">
        <span>Duração</span>
        <button id="decrease-time" class="decrease-button">-</button>
        <div id="duration-time">01:00</div>
        <button id="increase-time" class="increase-button">+</button>
      </div>
      <label class="tips-control" for="tips">
        <span>Dicas</span>
        <input type="checkbox" name="" id="tips">
      </label>
      <br>
      <button id="start-configured-game">Jogar</button>
    </section>
    
    <section id="distribution-panel">
      <h1 id="current-player-name"></h1>
      <p id="instruction">
          Passe o celular para o jogador indicado.
      </p>
      <div id="secret-area" hidden>
          <p id="secret-information"></p>
      </div>
      <div id="distribution-actions">
        <button id="reveal-button">
            Revelar minha palavra
        </button>
        <button id="next-button" hidden>
            Passar para o próximo
        </button>
      </div>
    </section>
    

    <section id="voting-screen">
      <h1>Hora de votar!</h1>
      <div class="base-timer" aria-live="polite"> <!--Ajuda tecnologias assistivas a perceberem que o conteúdo do timer está sendo atualizado.-->
        <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle class="base-timer__path-background" cx="50" cy="50" r="45"></circle> <!--Círculo de fundo cinza (primeiro).-->
          <circle id="base-timer-path-remaining" class="base-timer__path-remaining" cx="50" cy="50" r="45"></circle> <!--Círculo que representa o tempo restante.-->
        </svg>
        <span id="base-timer-label" class="base-timer__label">00:00</span>
        <div class="timer-progress" aria-hidden="true">
          <div id="timer-progress-bar"></div>
        </div>
      </div>
      <div id="players-to-vote-for">
      </div>
      <button id="voting-button" disabled>Votar</button>
      <p id="voting-result" role="status"></p> 
      <button id="play-again-impostor-button">Jogar Novamente</button>
      <button id="back-to-the-start-impostor-button">Voltar para início</button>
    </section>

  </main>
  <script src="js/state.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/games/themes/words.js"></script>
  <script src="js/games/impostor.js"></script>
  <script src="js/players.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
